<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#0a0a0a"/>
  <!-- capsule, rotated 45deg around center -->
  <g transform="rotate(-45 512 512)">
    <!-- bottom half (amber) -->
    <path d="M 362 512 L 662 512 L 662 662 A 150 150 0 0 1 362 662 Z" fill="#f59e0b"/>
    <!-- top half (off-white) -->
    <path d="M 362 512 L 662 512 L 662 362 A 150 150 0 0 0 362 362 Z" fill="#fafafa"/>
    <!-- seam -->
    <rect x="362" y="504" width="300" height="16" fill="#0a0a0a" opacity="0.25"/>
  </g>
  <!-- imprint dots on the amber half suggest an imprint code -->
  <g transform="rotate(-45 512 512)" fill="#0a0a0a" opacity="0.55">
    <circle cx="472" cy="600" r="16"/>
    <circle cx="552" cy="600" r="16"/>
  </g>
</svg>
